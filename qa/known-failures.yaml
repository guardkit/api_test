# F2 · known-failure ledger (guardkit qa kind: known-failures)
# The DOCUMENTED expected suite outcome + the pre-existing, triaged failures.
# Every suite run is compared against THIS ledger (LPA-09), not against "all
# green": an un-ledgered failure fails the gate; an unexpectedly-passing ledger
# entry is a stale-ledger finding. Zero net-new vs this ledger is the bar.
#
# Suite of record: qa/run-suite.sh (named in .guardkit/config.yaml as
# toolchain.test). It starts a throwaway PostgreSQL of its own and points the
# tests at it. Since 2026-09-12 a bare `.venv/bin/python -m pytest -q --forked`
# gets a real PostgreSQL too, because the tests start one themselves when
# nobody has named one (tests/suite_database.py) — so the figures below hold
# for either command. They do NOT hold on SQLite, which is what
# API_TEST_TESTS_USE_SQLITE=1 asks for.
#
# THE LEDGER IS EMPTY, AND THAT IS NEW (2026-09-13). Measured on the suite of
# record against real PostgreSQL: 839 passed, 0 failed, 2 deselected.
#
# It held twenty entries this morning, and all twenty are struck because all
# twenty now pass:
#   * FOURTEEN were one shipped defect — src/users/crud.py count_users_today
#     compared a timezone-AWARE datetime against users.created_at, which is
#     declared WITHOUT a timezone. SQLite tolerated it; PostgreSQL refused the
#     query, so GET /users/count-today answered 503 from its own
#     database-error handler. Fixed by building the day's boundaries as naive
#     datetimes to match the column.
#   * SIX asked PostgreSQL a question in SQLite's PRAGMA dialect. Rewritten to
#     read the schema in a way both databases understand (PRAGMA for SQLite,
#     information_schema for PostgreSQL) — the checks are unchanged, only the
#     way they ask.
#
# Both were written into this file with a note saying they must be STRUCK, not
# kept. This is that.
#
# The two deselected tests in qa/run-suite.sh are unchanged and still carry
# their reason there.
