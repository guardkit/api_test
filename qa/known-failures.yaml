# F2 · known-failure ledger (guardkit qa kind: known-failures)
# The DOCUMENTED expected suite outcome + the pre-existing, triaged failures.
# Every suite run is compared against THIS ledger (LPA-09), not against "all
# green": an un-ledgered failure fails the gate; an unexpectedly-passing ledger
# entry is a stale-ledger finding. Zero net-new vs this ledger is the bar.
#
# Suite of record (unchanged, points at the standing api-test-pg-factory1 DB):
#   DATABASE_URL="postgresql+asyncpg://postgres:test@localhost:5433/test" \
#     .venv/bin/python -m pytest -q --forked
# Observed baseline 2026-09-12 @ dc32caf: 805 passed, 20 failed (the twenty below),
# measured twice with the same result. The previous line claimed "170 passed, 2 failed",
# measured 2026-07-12 @ e5ff1c8 — it was out by roughly 650 for two months, and the two
# entries it listed no longer fail. It was wrong for a second reason: until dc32caf the
# fixture ignored the DATABASE_URL this script exports and ran every test on in-memory
# SQLite, so the suite of record had never once run against PostgreSQL.
#
# THE TWENTY ARE TWO CAUSES, NOT TWENTY PROBLEMS, and both are real:
#   * fourteen — src/users/crud.py count_users_today compares a timezone-AWARE datetime
#     against users.created_at, which is declared WITHOUT a timezone. SQLite tolerates it;
#     PostgreSQL refuses the query, so GET /users/count-today answers 503 from its own
#     database-error handler. VERIFIED AGAINST THE LIVE SERVICE on 2026-09-12: it returns
#     503 "can't subtract offset-naive and offset-aware datetimes" right now. This is a
#     SHIPPED DEFECT, not a test problem, and these entries must be struck when it is fixed.
#   * six — tests that read the schema with SQLite's own PRAGMA command, which PostgreSQL
#     cannot parse. What they check is real; they ask for it in a language only one of the
#     two databases speaks, so they need rewriting rather than ledgering for ever.
format_version: "1.0"
suite_id: api_test-pytest-suite
framework: pytest
language: python
expected:
  passed: 805
