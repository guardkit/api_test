# Pass-bar (guardkit qa kind: pass-bar) for the HURL-TWINS gate — the pilot
# bench of Rich's Q1/Q3 ruling (2026-08-14, options card 2062dd8): every Hurl
# twin under qa/twins/ is the executable double of ONE approved Gherkin
# scenario, and the bar is total — every twin assertion green = pass. A single
# red twin assertion fails the gate; there is no partial credit, because each
# twin IS a ruled specification behaviour. auth_surface_bearing:false — the
# repo's standing no-auth posture. The delete twins are data-destructive
# round-trips (create THROUGH the API, delete, honest 404), so
# dependency_down_degradation is carried by the parent feature's own pass-bar
# (TASK-UDBE-001); this pilot bar names no additional negative path beyond the
# honest-absence 404 already inside twin 9.4.
