    - base_url_reachable
    pass_bar_ref: qa/pass-bar-TASK-779B-001.yaml
    evidence_dir_pattern: qa/gates/evidence/{run_id}
  - id: user-domain-analytics-and-user-creation-extension
    path: qa/gates/user_domain_analytics_and_user_creation_extension_gate.py
    target:
