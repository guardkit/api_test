# deploy-profile (guardkit qa kind: deploy-profile)
# The per-repo deploy profile the DEPLOY stage reads to render its runbook. This
# app is the compose front door (Rich's standing doctrine): docker-compose.yml
# brings the app (uvicorn src.main:app on host :8901) plus its OWN postgres
# service on the compose-internal network (no host port bind — the standing
# api-test-pg-factory1 suite DB on :5433 is left untouched).
#
# secret_injection is EMPTY: the app's DATABASE_URL is wired app<->db over the
# compose network in docker-compose.yml (non-secret local test creds), so no
# register key is injected. Any future secret would appear here as a register
# key NAME only (values live in the WS5 register, never in this file).
format_version: "1.0"
env_id: local
compose:
  file: docker-compose.yml
  # The vetted wrapper the deploy_compose step runs (never inline shell). It puts
  # the sandbox described below in place, then runs deploy/deploy.sh INSIDE it and
  # exits with that script's exit code. deploy/deploy.sh itself is unchanged: it
  # snapshots the running image as the rollback tag then `up -d --build`, and in
  # revert mode re-tags the rollback image and `up -d --no-build`. It now talks to
  # the Docker engine inside the sandbox instead of the one on the host.
  # When the factory itself runs inside the sandbox (as it does for this
  # repository), forge does not run this wrapper: it runs deploy/deploy.sh
  # directly, by the wrapper's own name without "sandbox-". The wrapper stays
  # the attended, by-hand way to create the sandbox from the host.
  script: deploy/sandbox-deploy.sh
# How THIS project wants the identity of the thing forge checked handed to its
# deploy step, and what that step prints to say what is now running. Both names
# are the project's own to choose; forge carries them as text and knows nothing
# about what they mean here (here they mean a docker image tag and that image's
# own id). Declared 23 September 2026: these are the two names deploy/deploy.sh
# already reads and prints and deploy/sandbox-deploy.sh forwards into the
# sandbox, but until they were written down here the deploy worked by matching
# forge's defaults rather than by this project having said anything — and a
# project that declares nothing is not deployed blind, it is not deployed.
#   setting          -- the setting the identity is handed to the step in
#   reported_as      -- the marker the step prints one "<marker>=<identity>" line with
# Added 24 September 2026, after the second review of the executor stage. The
# promote used to make its unique name out of the SHARED candidate name, at
# promote time, so a second build that replaced that name in between had its
# image put live under this build's identity. The artifact is captured where it
# is CHECKED now and carried by its own immutable id, and what is running is
# read off the running container rather than off a tag.
#   checked_as       -- the marker the CHECK prints the artifact it checked under
#   artifact_setting -- the setting that artifact is handed BACK to the promote in
#   asked_with       -- the setting that asks this project, read-only and changing
#                       nothing, what it is running right now
#   running_as       -- the marker that read-only answer prints under
identity:
  setting: DEPLOY_IDENTITY
  reported_as: DEPLOYED_IDENTITY
  checked_as: CHECKED_ARTIFACT
  artifact_setting: DEPLOY_ARTIFACT
  asked_with: RUNNING_IDENTITY
  running_as: RUNNING_IDENTITY
# The Docker Sandbox this repository deploys into (Rich's decision, 2026-09-06:
# every merge deploys the feature into a microVM with its own kernel and its own
# Docker engine, made by Docker's `sbx` tool). One long-lived sandbox per
# repository. The deploy stage threads these settings to deploy/sandbox-deploy.sh
# as SANDBOX_NAME, SANDBOX_MEMORY, SANDBOX_CPUS, SANDBOX_PUBLISH (comma-joined)
# and SANDBOX_ALLOW_NETWORK (comma-joined); the wrapper never parses this file.
#   publish       -- the live app port and the candidate port, both handed back to
#                    the host's loopback so the health check and the live gate
#                    keep running from the host exactly as they do today.
#   allow_network -- the sandbox refuses every outbound address unless it is
#                    named here. These five let the image build: the Debian
#                    mirrors and the Python package index. Nothing that names
#                    one machine belongs in this file (it is public): the
#                    routes the factory's services inside need to reach this
#                    machine's model router, bus, memory and embedder are
#                    added to the sandbox's own network policy when the
#                    sandbox is set up on that machine, from settings kept
#                    off GitHub. `sbx policy ls <sandbox> --wide` shows them.
sandbox:
  name: api-test-deploy
  # Raised from 6g/4 on 2026-09-08: the sandbox now also carries the factory's
  # two services and every build's install and test run (sandbox first).
  memory: 12g
  cpus: 6
  publish: ["127.0.0.1:8901:8901", "127.0.0.1:8902:8902"]
  allow_network: ["deb.debian.org", "security.debian.org", "*.debian.org", "pypi.org", "files.pythonhosted.org"]
  # The sandbox carries the factory (sandbox first, 2026-09-07; the spec's Part
  # O rule 68): the deploy sidecar and the build runner run INSIDE it, on the
  # factory's own clone of this repository, reached by forge-prod on these two
  # loopback ports. The sandbox's own settings (the router's address and key,
  # the bus, the memory leg) are a sops-encrypted file rendered for the length
  # of the attended create command only, never named here and never in a shell.
  # The receipts folder mounted read-write into the sandbox is a path on one
  # machine, so it is not written here either: whoever creates the sandbox by
  # hand sets SANDBOX_RECEIPTS_PATH for that one command, and the sandbox's
  # own setup records it on the machine it belongs to.
  sidecar_publish: "127.0.0.1:8925:8125"
  runner_publish: "127.0.0.1:8924:8124"
hosts:
  - host: localhost
    role: app
secret_injection: []
models_required: []
health_checks:
  # A vetted SCRIPT path (FMDR D12: no freehand shell; exit code = verdict).
  # C4 live-caught 2026-07-16: a bare `curl ...` command line here is executed
  # no-shell as one filename -> exit 127. The expectation lives IN the script.
  - cmd: "deploy/healthcheck.sh"
# The kept :rollback tag deploy/deploy.sh maintains. On a FAILED post-deploy
# live-gate (O-32) forge renders a revert runbook carrying this ref; re-serving
# it brings the prior known-good build back up. Absent ⇒ a revert is a LOUD
# terminal failure (never a silent keep-serving of the unverified build).
rollback_image_ref: "apitest-app:rollback-pre-deploy"
# The working directory the scripts run in: the repository root. Written as
# "." rather than as a path on one machine (3 October 2026). The deploy helper
# inside the sandbox resolves a relative cwd against its own copy of this
# repository, and the factory runs every deploy leg of this repository through
# that helper. (The note this replaces required an absolute path because, in
# July, forge ran the scripts itself from its own home folder.)
cwd: "."
# Per-target live-gate driver (the F16 real backend). RepoDriverLiveGateInvoker
# runs this argv with cwd=repo root and env overlaid with `env` below, appending
# --feature/--target (and --gates when a subset is set). `python3` inside
# forge-prod is /opt/venv/bin/python3 (3.14.4) and imports guardkit — probed.
live_gate:
  driver: ["python3", "qa/gates/local_live_gate.py"]
  gates: []
  timeout_seconds: 600
  env:
    API_TEST_BASE_URL: "http://localhost:8901"
# Candidate-then-promote sandbox (design §3, S2). During the CANDIDATE leg ONLY,
# this `env` overlay is threaded to deploy.sh (CANDIDATE=1), to healthcheck.sh,
# and to the live-gate driver env, so the gate runs against the candidate copy on
# the offset port BEFORE it is allowed to take the live name. Absent ⇒ byte-
# identical to today's direct-live flow. `keep: false` ⇒ tear the candidate down
# after promote (true keeps it up on :8902 for manual poking).
# NOTE: the current forge parser folds this unknown top-level key into
# DeployProfile.extra (verified 2026-07-16, profile.py known_keys/extra); a
# parallel stage adds a typed `candidate:` parser. Until then it is inert to
# forge and consumed only by the candidate-leg env threading.
candidate:
  env:
    CANDIDATE_PORT: "8902"
    API_TEST_BASE_URL: "http://localhost:8902"
  keep: false
