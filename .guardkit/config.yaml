# The declared toolchain (2026-09-08, sandbox first): the merge-ready checks run
# this test command in the journey worktree inside the repository's sandbox,
# with the worktree's own venv, which the work legs bootstrap from pyproject.
toolchain:
  test: "qa/run-suite.sh"
  test_timeout: 900
  # 2026-09-19: the factory no longer treats an unmeasured required coverage as a
  # pass. This is how this project measures it (exit 0 = the 80% line minimum in
  # .claude/CLAUDE.md is met); the Coach runs it itself after its own test run.
  coverage: "qa/run-coverage.sh"
  coverage_timeout: 600
  # 2026-09-19: the whole-feature check. After the last build wave the factory
  # runs this one command over the assembled feature, before any merge can be
  # offered: it starts this candidate's own app against a throwaway Postgres and
  # runs the frozen Hurl twin of every scenario the feature's plan stamped
  # `verifier: hurl`. A stamped scenario with no twin fails it. Exit 0 = the
  # feature does what was asked at the surface a person uses.
  feature_check: "qa/feature-check.sh"
  feature_check_timeout: 900

# guardkit per-repo config.
# qa.enforce_tier1 turns on the tier-1 QA gate refusals for THIS repo
# (guardkit/qa/enforcement.py): suite-vs-ledger (qa/known-failures.yaml), the
# pass-bar-before-implementation ordering check, and the known-failures diff
# guard. Reversible: set to false (or delete this file) to restore the default
# OFF. Env override: GUARDKIT_QA_ENFORCE_TIER1.
qa:
  enforce_tier1: true
  # 2026-09-21: OFF. A scenario stamped `verifier: hurl` with no twin file is
  # now REPORTED as not checked instead of failing the build. The owner's
  # answer of 21 September 2026 to the first question of the way-forward plan:
  # "Q1: yes mark it not checked". With this on, the whole-feature check below
  # was never even run — the build was discarded before the product started, so
  # nobody could see what the finished feature did. With it off the central
  # guard still names every example that has no check file of its own, and
  # those names travel to the merge card as NOT CHECKED. They are never
  # recorded as covered or passed. Reversible: set to true to restore the hard
  # refusal (2026-09-19 behaviour).
  enforce_twin_coverage: false
  # 2026-08-15: the `spec_track: dcl` opt-in and the `dcl.capture` block that
  # lived here were REMOVED — the DCL track was deleted outright from guardkit
  # (card Q11, ruled 2026-08-15; guardkit b138d92c) and from the forge planning
  # driver the same day. Gherkin is the only track; nothing reads either key.

# QAV shadow mode (2026-07-25, design: ai-transition docs/qav-shadow-mode-design-2026-07-25.md).
# Log-only second opinion beside every coach verdict — never blocks, absent-not-fail,
# default OFF when this block is missing. Reversible one-line kill: enabled: false or
# delete the block. Zero verdict impact by construction (never-raise wrappers; the
# receipt qav_shadow_turn_N.json lands beside coach_turn_N.json).
autobuild:
  player:
    skills:
      - "skills/"
    # 2026-09-19: each skill body says to read its project-conventions reference
    # before changing routes, checks, transactions or evidence. Declared here so the
    # factory requires a complete read of each before the Player may act.
    required_documents:
      - "skills/fastapi/references/project-conventions.md"
      - "skills/sqlalchemy-database/references/project-conventions.md"
    protected_paths:
      - "tests/acceptance/"
      # 2026-09-19: the coder must not be able to edit the check that judges it.
      - "qa/feature-check.sh"
      - "qa/feature_check_twins.py"
  coach:
    # Coach v4 flip (2026-07-26, Rich's do-it-now): the tuned coach-ft-v4 seat
    # + the raw v4 wire contract. env GUARDKIT_COACH_CONTRACT / --coach-model
    # still override. Rollback = delete these two lines (defaults restore
    # gemma4-coach pairing at launch + the legacy coachsplit contract).
    contract: v4
    model: coach-ft-v4   # 2026-08-26 arm-T return (bake-off evens); was gemma4-26b-q8-coach for arm B
    qav_shadow:
      enabled: true
      endpoint: http://localhost:4000/v1/chat/completions   # 2026-09-05: through LiteLLM (counted; key from OPENAI_API_KEY via guardkit/lib/client_env), was the switchboard :9000 direct
      model: qav-shadow
      timeout_seconds: 60

# THE ROUTING LAW — ENFORCED on api_test (the first repo), Rich's ruling
# 2026-08-18 after two consecutive self-stamped machine-chain plans under the
# verbatim templates (drives 15: 8/8, 17: 6/6). Every approved scenario must
# carry a `verifier:` stamp from the closed vocabulary (toolchain, hurl, exam,
# probe:bus, probe:process, flutter, playwright, operator) — unstamped = loud
# plan-load failure, never a fallback home; the stamp normalizer writes stamps
# by rule at plan-commit and the specialist repairs title slips; a scenario no
# rule can decide is refused BY NAME on a card. Feature-level `routing_law:`
# in a feature YAML wins over this key (the 7 legacy no-Gherkin features carry
# `off`). Reversible: set to off. Card of record:
# ai-transition docs/bdd-replacement-options-card-2026-08-09.md (Q8/A.2).
routing_law: enforced

# Project-selected Fleet guidance; a new input for subsequent local evaluations.
# These tags select existing stored rules without changing retrieval thresholds.
memory:
  fleet:
    context_sources:
      relevant_patterns:
        document_tags:
          - rules_fastapi_python
